name: CI/CD Pipeline & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Code Quality, Security & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Check Type Integrity & Next.js Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://mock:mock@localhost:5432/mock
          NVIDIA_API_KEY: mock_key
          NVIDIA_API_BASE: https://integrate.api.nvidia.com/v1
          NVIDIA_MODEL: meta/llama-3.2-11b-vision-instruct
          JWT_SECRET: mock_secret_key_for_ci_build_validation_1234
